<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動画ネタ工房｜こくみん選挙ツール工房</title>
<meta name="description" content="ボタンを押すと、今日撮る動画のネタが出てきます。おみくじ形式の動画ネタメーカー。">
<style>
  :root { --blue:#0b3f7c; --blue-dark:#082c57; --yellow:#f5b800; --yellow-soft:#fff6d8; --bg:#f4f6f9; }
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body { margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; background:var(--bg); color:#222; }
  .num { font-family:Arial,"Helvetica Neue",sans-serif; }
  header { background:var(--blue); color:#fff; padding:16px 16px 14px; border-bottom:5px solid var(--yellow); }
  .head-in { max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:21px; }
  header p { margin:5px 0 0; font-size:13px; opacity:.92; line-height:1.6; }
  .bunny { flex:0 0 auto; }
  main { max-width:640px; margin:0 auto; padding:16px 16px 40px; }
  section { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size:14px; margin:0 0 10px; color:var(--blue); }
  .cats { display:flex; flex-wrap:wrap; gap:8px; }
  .cats button { flex:1 1 40%; border:2px solid #cdd7e4; background:#fff; border-radius:999px; padding:11px 4px; font-size:14px; font-weight:bold; cursor:pointer; color:#222; }
  .cats button.on { border-color:var(--blue); background:#e8f0fa; color:var(--blue); }
  .draw { width:100%; background:var(--yellow); color:#222; border:none; border-radius:12px; font-size:19px; font-weight:bold; padding:17px; cursor:pointer; box-shadow:0 3px 0 #c99300; margin-top:14px; }
  .draw:active { transform:translateY(2px); box-shadow:0 1px 0 #c99300; }
  .cardwrap { perspective:900px; margin-top:16px; }
  .card { background:var(--yellow-soft); border:2px solid var(--yellow); border-radius:14px; padding:20px 18px; min-height:190px; }
  .card.empty { background:#f8f9fb; border:2px dashed #cdd7e4; color:#666; display:flex; align-items:center; justify-content:center; text-align:center; font-size:14px; line-height:1.9; }
  .card.flip { animation:flipIn .55s ease; }
  @keyframes flipIn { 0% { transform:rotateY(88deg); opacity:0; } 100% { transform:rotateY(0deg); opacity:1; } }
  .chip { display:inline-block; background:var(--blue); color:#fff; font-size:11px; font-weight:bold; border-radius:999px; padding:3px 11px; }
  .card h3 { font-size:21px; margin:12px 0 10px; line-height:1.55; color:var(--blue-dark); }
  .card p.advice { font-size:15px; line-height:1.95; margin:0; }
  .card .idx { font-size:11px; color:#999; margin-top:16px; text-align:right; }
  .redraw { width:100%; background:#fff; color:var(--blue); border:2px solid var(--blue); border-radius:12px; font-size:16px; font-weight:bold; padding:13px; cursor:pointer; margin-top:12px; display:none; }
  .redraw.show { display:block; }
  .note { font-size:12px; color:#666; line-height:1.8; margin:0; }
  footer { text-align:center; font-size:12px; color:#888; padding:0 16px 26px; line-height:1.7; }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <svg class="bunny" width="44" height="52" viewBox="0 0 44 52" aria-hidden="true">
      <ellipse cx="14" cy="11" rx="5" ry="10" fill="#fff"/>
      <ellipse cx="30" cy="11" rx="5" ry="10" fill="#fff"/>
      <ellipse cx="14" cy="12" rx="2.4" ry="6.4" fill="#f5b800"/>
      <ellipse cx="30" cy="12" rx="2.4" ry="6.4" fill="#f5b800"/>
      <circle cx="22" cy="32" r="14" fill="#fff"/>
      <circle cx="17" cy="30" r="1.8" fill="#0b3f7c"/>
      <circle cx="27" cy="30" r="1.8" fill="#0b3f7c"/>
      <path d="M19 36 Q22 38.5 25 36" stroke="#0b3f7c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <circle cx="11.5" cy="35" r="2.4" fill="#ffd9de"/>
      <circle cx="32.5" cy="35" r="2.4" fill="#ffd9de"/>
    </svg>
    <div>
      <h1>動画ネタ工房</h1>
      <p>ボタンを押すと、今日撮る動画のネタが出てきます</p>
    </div>
  </div>
</header>
<main>
  <section>
    <h2>カテゴリを選ぶ</h2>
    <div class="cats" id="cats">
      <button type="button" data-cat="all" class="on">全部</button>
      <button type="button" data-cat="政治・政策">政治・政策</button>
      <button type="button" data-cat="じもとのこと">じもとのこと</button>
      <button type="button" data-cat="日常・自己紹介">日常・自己紹介</button>
    </div>
    <button type="button" class="draw" id="draw">🎋 ネタを引く</button>
    <div class="cardwrap">
      <div class="card empty" id="card">まだ引いていません。<br>カテゴリを選んで、「ネタを引く」を押してみましょう。</div>
    </div>
    <button type="button" class="redraw" id="redraw">もう一本引く</button>
  </section>
  <section>
    <p class="note">ネタは政治活動の範囲で作られています。撮影時はお店や施設の許可を取ってください。</p>
  </section>
</main>
<footer>こくみん選挙ツール工房</footer>
<script>
"use strict";
const NETA = [{"id": "P-01", "category": "政治・政策", "title": "ゴミのこと、それって地方議会の仕事？", "advice": "指定ゴミ袋の有料化、ゴミの分別ルールの変更、不法投棄への罰則などを定める「条例」を作るのは地方議会の仕事です。まずはこの答えを言い切ってから、地元の話題に落とし込んでみましょう。「●●市では今、（ゴミ袋の価格や分別ルール）が話題になっています」と続け、ご自身の改善案を添える展開はいかがでしょうか。"}, {"id": "P-02", "category": "政治・政策", "title": "水道料金は誰がどうやって決めるの？", "advice": "水道事業は基本的に各市町村が運営しており、水道料金の改定には地方議会の議決が必要です。老朽化した水道管の更新費用がかかる一方、家計への負担も大きいため、議会でも重要なテーマになります。「●●市の水道料金は今（現状）ですが、私は（自分の考え）を大切にしたい」と、生活目線で語りかけてみてください。"}, {"id": "P-03", "category": "政治・政策", "title": "春の通学路、ガードレールは誰に頼む？", "advice": "市町村道にあるガードレールの設置や白線の引き直しは、市町村の担当課が管理しており、予算は議会で審議されます。春の新入学シーズンに合わせて、自宅や事務所で「危ないと感じる交差点、ありませんか？」と問いかけてみましょう。学校や子どもが映らないよう室内で撮り、「●●市の（具体的な課題）をこう点検したい」と締めるのもいいですね。"}, {"id": "P-04", "category": "政治・政策", "title": "学校給食の無償化、実現のカギは？", "advice": "学校給食費の無償化や一部補助は、各自治体の判断と予算編成によって実施できる事業です。財源の確保だけでなく、地元食材を使う地産地消の推進もセットで議論されることが増えています。「●●市では今、（給食費の現状）ですが、私は（自分の提案）を目指したい」と、子育て世代に寄り添うトーンで話してみてください。"}, {"id": "P-05", "category": "政治・政策", "title": "図書館の開館時間、もっと延ばせない？", "advice": "公立図書館の開館時間や休館日、電子書籍の導入などは、自治体の条例や予算によって決められます。仕事や学校帰りにも立ち寄れるかどうかは、まちの暮らしやすさに直結するテーマです。「あなたが●●市の図書館に『これがあったらいいな』と思うサービスは何ですか？」と視聴者に問いかけ、ご自身のアイデアを1つ紹介する流れはいかがでしょうか。"}, {"id": "P-06", "category": "政治・政策", "title": "免許返納後のバス、議会でどう議論する？", "advice": "路線バスの維持やコミュニティバス、予約制のデマンド交通の導入は、自治体の交通計画と予算で支えられています。シニア世代の買い物や通院に欠かせないため、多くの自治体で最優先課題になっています。通行人が映らないバス停付近か室内で、「●●市の（地域名）の移動を、私は（自分の提案）で支えたい」と温かく語りかけてみましょう。"}, {"id": "P-07", "category": "政治・政策", "title": "冬の除雪、どこまでが自治体の仕事？", "advice": "道路の除雪は、国道は国、都道府県道は都道府県、生活道路の多くは市町村が担うという役割分担があります。雪の季節に「うちの前の道路、いつ除雪車が来るの？」という住民の疑問に答える切り口は共感を集めやすいです。「●●市の除雪体制について、私は（排雪や高齢者宅支援などの提案）を強化したい」と前向きに伝えてみてください。"}, {"id": "P-08", "category": "政治・政策", "title": "増える空き家、市役所はどこまで動ける？", "advice": "倒壊の恐れがある危険な空き家は、自治体が「特定空家」に指定して改善を指導したり、解体費用の補助制度を作ったりすることができます。放置すると防犯や景観の問題につながるため、早めの対策がカギです。「●●市には今、（空き家の現状）があります。解体だけでなく（利活用や相談窓口などの提案）も進めたい」と展開するのはいかがでしょうか。"}, {"id": "P-09", "category": "政治・政策", "title": "公園の遊具やトイレ、誰が直している？", "advice": "身近な街区公園の管理や遊具の更新、トイレの洋式化などは、市町村の予算と維持管理計画で行われます。子どもだけでなく、散歩するシニアにとっても大切な憩いの場です。他の利用者が映らない公園ベンチか室内で、「●●市の公園、ここがこう変わったら嬉しいですよね」とビフォーアフターを想像させる話し方をしてみてください。"}, {"id": "P-10", "category": "政治・政策", "title": "保育園の空き情報、もっと見やすくできる？", "advice": "認可保育園の入所調整や保育士の処遇改善加算、空き状況の公開方法は、市町村の子育て支援策として決定されます。待機児童の数だけでなく、「希望の園に入りやすいか」「手続きが分かりやすいか」も保護者の大きな悩みです。「●●市の保活でよく聞く（悩み）を、（自分の政策）で少しでも軽くしたい」と寄り添う一言で締めるのもいいですね。"}, {"id": "P-11", "category": "政治・政策", "title": "小1の壁と学童保育、自治体にできること", "advice": "放課後児童クラブ（学童保育）の定員拡充や開所時間の延長、指導員の確保は、市町村が責任を持って整備する事業です。小学校入学と同時に働き方が難しくなる「小1の壁」は、共働き世帯の切実なテーマです。「●●市の学童は今（現状）ですが、親も子も安心できるよう（自分の提案）を進めたい」と、春の時期に合わせて語ってみてはいかがでしょうか。"}, {"id": "P-12", "category": "政治・政策", "title": "道路の穴や切れた街灯、一番早い連絡先は？", "advice": "市町村道の舗装の傷みや街灯の球切れは、市役所の担当課へ連絡すれば補修の対象になり、最近はLINEなどで通報できる自治体も増えています。まずは「身近な不便はこうして直せます」と役立つ豆知識から入ってみましょう。「●●市でも（通報の仕組みや修繕予算の現状）をもっとスピーディにしたい」とつなげると、現場感覚が伝わります。"}, {"id": "P-13", "category": "政治・政策", "title": "国民健康保険料、なぜ自治体ごとに違うの？", "advice": "国民健康保険は都道府県と市町村が共同で運営しており、保険料率や独自の減免制度は自治体の財政状況や条例によって決まります。自営業やフリーランス、退職後の方にとって毎月の固定費に直結する話題です。「●●市の国保料について、まずは仕組みを分かりやすく伝えつつ、（負担軽減や健康づくり支援などの考え）に取り組みたい」と丁寧に話してみてください。"}, {"id": "P-14", "category": "政治・政策", "title": "親の介護で困ったら、まずどこに相談？", "advice": "介護の悩みは、市町村が設置する「地域包括支援センター」に無料で相談でき、介護保険の運営や独自の高齢者支援も自治体の仕事です。「いきなり介護が始まったら焦りますよね」と共感から入ると、幅広い世代に届きます。「●●市の相談窓口をもっと身近にするため、私は（自分の提案）を広めたい」と締める展開はいかがでしょうか。"}, {"id": "P-15", "category": "政治・政策", "title": "市の予算、一番お金を使っている分野は？", "advice": "自治体の一般会計予算では、多くの場合、子育て・高齢者・障がい者支援を含む「民生費」が最大の割合を占めています。数字を1つだけ紙に書いて見せながら、「●●市の予算は約（金額）円、その中で一番大きいのは（分野）です」と紹介してみてください。「この限られた予算を（自分の重点政策）にしっかり活かしたい」とつなげると説得力が増します。"}, {"id": "P-16", "category": "政治・政策", "title": "ふるさと納税、うちの町はプラス？マイナス？", "advice": "ふるさと納税は、地域外からの寄付が増えるチャンスである一方、住民が他自治体へ寄付すると地元の住民税収が減るという両面があります。返礼品の開発支援や寄付金の使い道は、自治体の工夫が光る分野です。「●●市の魅力である（特産品や観光資源）をもっと発信して、（寄付金の使い道アイデア）につなげたい」と明るく語ってみましょう。"}, {"id": "P-17", "category": "政治・政策", "title": "防災無線が聞こえにくい！どう改善する？", "advice": "防災行政無線の整備に加え、近年はスマホアプリやメール、電話の自動応答サービスなど複数の手段で情報を届ける自治体が増えています。気密性の高い住宅では外のスピーカーが聞こえにくいという声はとても多いです。「●●市でも（情報伝達の現状）を点検し、誰でも確実に情報が届く（自分の提案）を進めたい」と普段からの備えとして話してみてください。"}, {"id": "P-18", "category": "政治・政策", "title": "体育館のエアコン、避難所として必要？", "advice": "学校の体育館や公民館などの指定避難所に空調設備や段ボールベッド、簡易トイレを備蓄するのは、市町村の防災予算の重要な使い道です。災害に便乗するのではなく、普段の夏冬の過ごしやすさとも絡めて話すのがポイントです。「●●市の避難所環境は今（現状）です。いざという時に誰もが安心できるよう（自分の提案）を計画的に進めたい」と伝えてみましょう。"}, {"id": "P-19", "category": "政治・政策", "title": "古くなった公民館や庁舎、どう維持する？", "advice": "高度経済成長期に建てられた公共施設の一斉老朽化は全国共通の課題で、自治体は「公共施設等総合管理計画」を作って長寿命化や複合化を進めています。お金のかかる話だからこそ、家族や支援者からの「建て替えってお金かかるよね？」という質問に答える形もおすすめです。「●●市では（施設の現状）を住民と話し合いながら（自分の考え）で解決したい」と誠実に語ってみてください。"}, {"id": "P-20", "category": "政治・政策", "title": "役所の手続き、スマホで完結できる？", "advice": "住民票のコンビニ交付やオンライン申請の導入など、自治体のデジタル化（DX）は議会の予算承認を経て進められます。窓口に行く時間がない現役世代に喜ばれる一方、スマホが苦手な方への配慮も欠かせません。「デジタルで便利にしつつ、窓口の温かさも残すのが理想です。●●市ではまず（具体的な手続き）から使いやすくしたい」と提案してみてはいかがでしょうか。"}, {"id": "P-21", "category": "政治・政策", "title": "商店街の空き店舗、自治体はどう応援できる？", "advice": "空き店舗を借りて新しくお店を始める人への改装費・家賃補助や、創業相談窓口の設置は、多くの自治体が実施できる地域経済対策です。昼間の商店街の雰囲気を感じつつ（店舗が映る場合は許可を取って）、あるいは事務所で語ってみましょう。「●●市の（商店街名など）に新しいお店が増えるよう、（自分の応援策）を後押ししたい」と前向きに締めるのもいいですね。"}, {"id": "P-22", "category": "政治・政策", "title": "畑を守る鳥獣害対策、議会の役割は？", "advice": "イノシシやシカ、サルなどによる農作物被害を防ぐ電気柵の設置補助や、有害鳥獣捕獲の担い手支援は、自治体の農林水産予算で組まれます。秋の収穫シーズンに合わせると、農家の方の苦労や地域の食の大切さがより伝わります。「●●市の美味しい（地元の農産物）を守るため、私は（自分の対策案）に力を入れたい」と語ってみてください。"}, {"id": "P-23", "category": "政治・政策", "title": "移住者を増やすカギ、補助金だけじゃない？", "advice": "移住・定住支援には住宅取得補助や空き家バンクの整備がありますが、実際には「仕事」「子育て環境」「地域とのなじみやすさ」も大きな決め手になります。まずは「もし友達に●●市を勧めるなら、どこを推しますか？」と軽く問いかけてみましょう。その上で「●●市を選んでくれた人がずっと暮らしたくなる（自分の提案）を作りたい」とつなげる展開はいかがでしょうか。"}, {"id": "P-24", "category": "政治・政策", "title": "子どもの医療費助成、何歳までが対象？", "advice": "子ども医療費の助成（無料化や一部負担軽減）は、都道府県の制度に市町村が独自の上乗せをして対象年齢を広げることができます。病院の外観は映さず、自宅や事務所で落ち着いて説明するスタイルが安心です。「●●市は現在（対象年齢など）ですが、子育て家庭の安心を広げるため（自分の考え）を目指したい」とシンプルに伝えてみてください。"}, {"id": "P-25", "category": "政治・政策", "title": "産後ケア事業って知っていますか？", "advice": "出産後の母親の心身ケアや育児相談を助産師などから受けられる「産後ケア事業」は、市町村の努力義務となっており、利用料の助成や利用しやすさは自治体ごとに工夫されています。「出産直後は本当に大変ですよね」と労いの言葉から入ってみましょう。「●●市でも（現状の制度）をさらに使いやすくするため、（自分の提案）を広げていきたい」と優しく語りかけてみてください。"}, {"id": "P-26", "category": "政治・政策", "title": "認知症になっても安心なまちの仕組み", "advice": "認知症サポーター養成講座の開催や、行方不明時の見守りネットワークの構築は、市町村が地域住民や事業者と連携して進める取り組みです。誰でもなり得る身近なテーマだからこそ、暗くならずに支え合いの大切さを伝えましょう。「●●市で（見守りや相談のアイデア）を広げ、誰もが安心して散歩できるまちにしたい」と温かく締めるのもいいですね。"}, {"id": "P-27", "category": "政治・政策", "title": "自転車のヘルメット購入、補助はあるの？", "advice": "自転車乗車時のヘルメット着用が努力義務化されたことを受け、購入費の一部を助成する制度を独自に設ける市町村が増えています。朝の駅立ちの前後（安全な場所で固定撮影）に話すと、通勤・通学のリアルな話題として届きやすいです。「●●市での補助の有無や駐輪場の使いやすさなど、自転車に優しい（自分の提案）を進めたい」と話してみてください。"}, {"id": "P-28", "category": "政治・政策", "title": "夏の猛暑、クーリングシェルターってなに？", "advice": "熱中症特別警戒アラートが出た際、誰でも涼める公共施設や商業施設を市町村が指定する仕組みを「クーリングシェルター（指定暑熱避難施設）」といいます。夏の昼間、涼しい室内で水分補給を呼びかけながら紹介すると季節感が出ます。「●●市では（指定場所の現状）がありますが、高齢者や外回りの方も気軽に休めるよう（自分の工夫）を提案したい」とつなげてみましょう。"}, {"id": "P-29", "category": "政治・政策", "title": "地域のお祭りや伝統行事、どう残していく？", "advice": "地域のお祭りや伝統芸能の保存会への活動助成、道具の修繕費補助、広報支援などは、自治体の文化振興策として行われています。担い手不足に悩む地域が多いため、夏祭りや秋祭りの季節にぴったりのテーマです。「●●市の（伝統行事や祭り）を次の世代へつなぐため、私は（自分の応援アイデア）に取り組みたい」と愛着を込めて語ってみてください。"}, {"id": "P-30", "category": "政治・政策", "title": "観光PR、うちの町の「隠れた強み」は？", "advice": "観光協会への補助やSNSを活用したプロモーション、案内看板の整備などは、市町村の観光・商工予算で動かします。有名な観光地がなくても、日常のグルメや風景が旅人には魅力的に映るものです。「●●市には（地元の隠れた魅力）があります。外から人が訪れたくなる（自分のPR案）を仕掛けたい」とワクワク感を持って話してみてください。"}, {"id": "P-31", "category": "政治・政策", "title": "家の省エネや太陽光、市の補助金はある？", "advice": "断熱窓へのリフォームや高効率給湯器、太陽光パネル・蓄電池の導入に対する補助金は、国の制度に上乗せする形で市町村が独自に設けている場合があります。電気代の高騰が気になる今、家計に直結する嬉しい情報として届きます。「●●市の補助制度を分かりやすく伝えつつ、（自分の環境・家計応援策）を広げたい」と提案してみてはいかがでしょうか。"}, {"id": "P-32", "category": "政治・政策", "title": "地域猫やペット防災、自治体の取り組みは？", "advice": "飼い主のいない猫の不妊去勢手術費の助成や、災害時のペット同行避難のルールづくりは、自治体によって進み具合が大きく異なる分野です。ペットを飼っている人にも、飼っていない人にも関心の高いテーマです。「人と動物が気持ちよく共生できる●●市を目指し、私は（自分の提案）に取り組みたい」と優しい口調で語りかけてみてください。"}, {"id": "P-33", "category": "政治・政策", "title": "町内会・自治会の負担、軽くできない？", "advice": "回覧板のデジタル化支援や、市役所から町内会への配布物の見直し、防犯灯の維持管理の市移管など、自治体の工夫で地域役員の負担を減らす動きが広がっています。「役員が回ってくるのが大変…」という声は多くの住民が共感する本音です。「●●市でも、地域のつながりを守りながら負担を減らす（自分のアイデア）を進めたい」と話すと親近感がわきます。"}, {"id": "P-34", "category": "政治・政策", "title": "地域の消防団、どうやって応援する？", "advice": "普段は別の仕事をしながら地域の防災を支える消防団員の報酬や装備の充実、入団促進の取り組みは、市町村の条例と予算で決められます。全国的に団員不足が課題となっており、感謝とともに環境改善を訴える意義は大きいです。「●●市の安全を守ってくれている消防団の皆さんを支えるため、（自分の応援策）に取り組みたい」と敬意を込めて伝えてみましょう。"}, {"id": "P-35", "category": "政治・政策", "title": "「議会だより」読んでますか？もっと見やすく！", "advice": "市町村議会が発行する「議会だより」の紙面づくりや、本会議のインターネット中継・SNS発信の充実は、議会自身の改革で変えることができます。「正直、文字が多くて読まないよね」とくすっと笑える本音から入ってみましょう。「誰が何を発言したか一目でわかるよう、●●市議会では（自分の改革案）に挑戦したい」と明るく語ってみてください。"}, {"id": "P-36", "category": "政治・政策", "title": "市民が議会に声を届ける「請願・陳情」とは？", "advice": "住民が議会に直接要望を出せる仕組みに「請願（議員の紹介が必要）」と「陳情（紹介不要）」があり、議会で審査される大切な権利です。意外と知られていない仕組みを1分で解説すると、「勉強になった！」と喜ばれます。「皆さんの声を議会へ届けるパイプ役として、●●市で（自分のスタンス）を大切にしたい」と締めるのもいいですね。"}, {"id": "P-37", "category": "政治・政策", "title": "家族の介護をする子どもたち、どう支える？", "advice": "本来大人が担うような家事や家族の世話を日常的に行う「ヤングケアラー」の支援は、学校・福祉・地域が連携する自治体の相談体制づくりがカギになります。深刻になりすぎず、「ひとりで抱え込まなくていい仕組みを作りたい」という温かさを前に出しましょう。「●●市でも（相談窓口や支援のアイデア）を充実させ、若い世代の未来を守りたい」と丁寧に伝えてみてください。"}, {"id": "P-38", "category": "政治・政策", "title": "学校に行きづらい子の居場所、どう増やす？", "advice": "不登校の子どもたちが安心して過ごせる「教育支援センター」の運営や、民間のフリースクール利用料の補助は、自治体独自の判断で拡充できる分野です。学びの形が多様化する今、悩んでいる保護者にとって大きな希望になるテーマです。「●●市の子どもたちが自分らしく学べるよう、私は（自分の提案）を後押ししたい」と穏やかに語りかけてみましょう。"}, {"id": "P-39", "category": "政治・政策", "title": "障がいのある人の仕事や移動、どう支える？", "advice": "障がい福祉サービスの給付に加え、移動支援の拡充や、市役所での優先調達（福祉事業所の製品購入）などは、市町村が力を入れられる分野です。誰もが暮らしやすいまちは、結果的にすべての人に優しいまちになります。「●●市で（バリアフリーや就労応援などの提案）を進め、一人ひとりの力を活かせる地域にしたい」と前向きに話してみてください。"}, {"id": "P-40", "category": "政治・政策", "title": "小児科や夜間診療、地域の医療をどう守る？", "advice": "休日夜間急患センターの運営や、医師・看護師確保のための奨学金制度、オンライン診療の支援などは、市町村や広域連合が取り組める地域医療対策です。病院は映さず、自宅や事務所で「夜中に子どもが熱を出したとき、本当に不安ですよね」と共感から入ってみましょう。「●●市の医療体制を守るため、（自分の提案）にしっかり向き合いたい」と締める展開はいかがでしょうか。"}, {"id": "P-41", "category": "政治・政策", "title": "大雨のたびに冠水する道路、どう対策する？", "advice": "側溝の清掃や雨水管の整備、雨水貯留タンクの設置補助など、身近な排水（内水氾濫）対策は市町村の土木・下水道部門が担います。梅雨や台風の季節が来る前の「平時」に、備えの話として発信するのがポイントです。「●●市の（気になっている課題）を放っておかず、（自分の点検・整備案）を進めていきたい」と頼もしく伝えてみてください。"}, {"id": "P-42", "category": "政治・政策", "title": "使われていない広場、ドッグランやマルシェに？", "advice": "自治体が管理する公園や空き地は、条例の運用を見直したり民間と連携したりすることで、ドッグランやキッチンカーの出店場所として活用できるケースが増えています。「ただの空き地が、週末の楽しい場所に変わったらワクワクしませんか？」と明るい切り口で始めてみましょう。「●●市の（場所やエリア）でも、（自分の活用アイデア）を提案してみたい」と語ってみてください。"}, {"id": "P-43", "category": "政治・政策", "title": "お墓や終活の悩み、市役所に相談できる？", "advice": "公営墓地の合葬墓（永代供養墓）の整備や、ひとり暮らし高齢者のための「終活情報登録事業」を導入する自治体が全国で増えています。将来の安心に関わる話題なので、重くなりすぎず「元気なうちに準備できると安心ですよね」と軽やかに切り出しましょう。「●●市でも（終活サポートの提案）を整え、シニア世代の不安を減らしたい」とつなげるのもいいですね。"}, {"id": "P-44", "category": "政治・政策", "title": "地元の名店や町工場、後継ぎをどう応援する？", "advice": "中小企業や個人事業主の事業承継を応援するため、商工会と連携したマッチング支援や、引き継ぐ際の設備投資補助を行う自治体があります。「昔からあるあのお店がなくなったら寂しいですよね」と地元の愛着に訴えかけてみてください。「●●市の技術や味を次世代へつなぐため、私は（自分の応援策）に力を入れたい」と語ると共感が広がります。"}, {"id": "P-45", "category": "政治・政策", "title": "シニア向けスマホ教室、もっと身近に！", "advice": "デジタル化が進む一方で取り残される人が出ないよう、公民館でのスマホ相談会や出張サポートに予算をつける市町村が増えています。「スマホの操作って、ちょっと誰かに聞けるだけで安心しますよね」と笑顔で語りかけてみましょう。「●●市でも（スマホ教室や相談窓口のアイデア）を広げ、誰もがデジタルの恩恵を受けられるまちにしたい」と締めてみてください。"}, {"id": "P-46", "category": "政治・政策", "title": "地元で働く若者の奨学金、市が応援できる？", "advice": "大学などを卒業後に地元へ戻って就職・定住した若者を対象に、奨学金の返還額の一部を補助する制度を設ける自治体が全国に広がっています。若者の定住と地元企業の人手不足解消を同時に狙える人気の政策です。「●●市で頑張る若い世代を応援するため、私は（奨学金支援や就職応援の提案）を実現したい」と力強く語ってみてはいかがでしょうか。"}, {"id": "P-47", "category": "政治・政策", "title": "道の駅や直売所、もっと地域の拠点に！", "advice": "道の駅や農産物直売所は、地元食材の販売だけでなく、防災拠点や高齢者の交流の場としても機能するよう、自治体が整備や運営支援に関わっています。停車中の車内や自宅で「地元の美味しいものが集まる場所って元気が出ますよね」と切り出してみましょう。「●●市の（施設や特産品）を活かして、（自分の活性化アイデア）を進めたい」とつなげてみてください。"}, {"id": "P-48", "category": "政治・政策", "title": "体育館やグラウンド、スマホで予約できる？", "advice": "市民体育館やテニスコート、公民館の会議室などの予約システムをオンライン化し、キャッシュレス決済に対応する自治体が急増しています。「わざわざ窓口に申請書を出しに行くの、ちょっと大変ですよね」と身近な実感から入ってみましょう。「●●市のスポーツ・文化施設をもっと気軽に使えるよう、（予約改善や設備充実の提案）を進めたい」と話してみてください。"}, {"id": "P-49", "category": "政治・政策", "title": "10年後のまちの設計図「総合計画」って？", "advice": "市町村が今後5年〜10年でどんなまちを目指すかを定めた最上位の計画を「総合計画」といい、策定や見直しには住民の意見募集と議会の議決が関わります。年末年始などの節目に「10年後の●●市、どんなまちになっていてほしいですか？」と問いかけてみましょう。「私は（自分の目指すまちの姿）を設計図にしっかり描き込みたい」と前向きに語ってみてください。"}, {"id": "P-50", "category": "政治・政策", "title": "議会の「一般質問」って、何をする時間？", "advice": "年に4回ほど開かれる定例議会で、議員が市長や町長に対して地域の課題や政策を直接問いかけ、答弁を引き出す場を「一般質問」といいます。議員の仕事の中で最も分かりやすく、住民の声を届ける見せ場でもあります。「もし私が●●市議会の壇上に立ったら、一番最初に（自分の最重要テーマ）について質問したいです！」と熱意を込めて締めるのはいかがでしょうか。"}, {"id": "L-01", "category": "じもとのこと", "title": "地元で一番歴史ある老舗の秘密", "advice": "長年地域で愛される老舗には、味や技術だけでなく「まちの記憶」が詰まっています。お店の許可を取ってから店先や商品を紹介し、「●●市で（創業年数）年続く（お店の名前）さんに来ています」と切り出してみましょう。店主の方から聞いたちょっとした裏話を1つ添えると、地元への愛着がぐっと伝わります。"}, {"id": "L-02", "category": "じもとのこと", "title": "朝の駅前、ほっと一息つけるスポット", "advice": "通勤・通学前の数分間に立ち寄れる場所は、まちの元気を支える大切な拠点です。駅構内や店舗は必ず許可を取ってから、通行人が映らない画角で撮影してください。「朝の駅立ちのあと、私はよく（お店やスポット名）でパワーをもらっています」と紹介し、おすすめの理由を一言添える展開はいかがでしょうか。"}, {"id": "L-03", "category": "じもとのこと", "title": "地元民でも意外に知らない？地名の由来クイズ", "advice": "普段何気なく呼んでいる町名や交差点の名前には、昔の地形や暮らしにまつわる面白い由来が隠れています。自宅や事務所で「●●市にある（地名）、なんでそう呼ばれるか知っていますか？」とクイズ形式で始めてみましょう。3秒ほど間を置いて答えを発表し、「歴史を知ると散歩が楽しくなりますよね」と締めるのもいいですね。"}, {"id": "L-04", "category": "じもとのこと", "title": "春のお花見、私のおすすめ桜スポット", "advice": "有名な桜並木だけでなく、地元民だけが知っている静かな桜スポットはSNSでとても喜ばれます。春の晴れた日に通行人の顔が映らない角度でスマホを固定し、「●●市で春を感じるなら、私は（場所の名前）が一番好きです」と紹介してみてください。「皆さんの推し桜スポットもコメントで教えてください！」と呼びかけると交流が生まれます。"}, {"id": "L-05", "category": "じもとのこと", "title": "地元スーパーのご当地食材コーナー", "advice": "地元のスーパーには、その地域ならではの調味料や野菜、お惣菜など「暮らしのリアルな魅力」が並んでいます。店内で撮る場合は必ずお店の許可を取ってから、あるいは買ってきた商品を自宅の机に並べて撮影しましょう。「●●市の食卓に欠かせない（商品名）、県外の人に見せると驚かれますよね」とくすっと笑えるトーンで紹介してみてください。"}, {"id": "L-06", "category": "じもとのこと", "title": "夕焼けが一番きれいに見える場所", "advice": "一日の終わりに眺める夕焼けは、忙しい毎日にほっと一息つかせてくれる地域の宝物です。夕方の安全な歩道や公園で立ち止まってスマホを固定し、景色を少し見せてから語りかけてみましょう。「●●市で一番夕焼けがきれいなのは（場所の名前）だと思っています。今日も一日お疲れさまでした！」と労う締めにすると好印象です。"}, {"id": "L-07", "category": "じもとのこと", "title": "夏祭りの思い出と、今年の見どころ", "advice": "地域の夏祭りは、子どもからシニアまで世代を超えて笑顔になれる大切な行事です。自宅や事務所でうちわを手に持ちながら、「もうすぐ●●市の（お祭り名）ですね！」と明るく切り出してみましょう。「子どもの頃は（自分の思い出）が楽しみでした。今年は（見どころや日程）に注目しています」と地域への愛着を語ってみてください。"}, {"id": "L-08", "category": "じもとのこと", "title": "地元パン屋さんの「推しの1個」を紹介", "advice": "地域に根ざしたパン屋さんの話題は、幅広い世代から「そこ美味しいよね！」と共感を集めやすい鉄板ネタです。お店の許可を取ってから外観やパンを紹介するか、購入後に自宅で食べながら語りましょう。「●●市の（パン屋さん名）に行ったら、私は絶対（パンの名前）を買います！」と熱量たっぷりに紹介する展開はいかがでしょうか。"}, {"id": "L-09", "category": "じもとのこと", "title": "まちの歴史を物語る石碑・史跡めぐり", "advice": "道端にひっそりと立つ石碑や古い道標には、そのまちが歩んできたドラマが刻まれています。私有地に入らないよう注意して立ち止まり、「毎日通るこの道にある（史跡名）、実は（歴史の豆知識）なんです」と紹介してみてください。「調べてみたらすごく面白かったので、皆さんにもシェアします」と軽やかに話すと親しみやすくなります。"}, {"id": "L-10", "category": "じもとのこと", "title": "秋の味覚！地元産の旬の野菜・果物", "advice": "秋は地元の農産物が一番輝く季節であり、生産者さんへの感謝を伝える絶好のタイミングです。自宅のテーブルに地元産の旬の食材を置いて、「●●市の秋といえば、やっぱり（野菜・果物名）ですよね！」と笑顔で見せてみましょう。「私は（おすすめの食べ方）にするのが大好きです。地元の恵みに感謝！」と締めるのもいいですね。"}, {"id": "L-11", "category": "じもとのこと", "title": "冬の朝、凛と光る地元の絶景", "advice": "寒さが厳しい冬の朝だからこそ見られる澄んだ空気や雪景色、朝焼けは、その土地ならではの美しさがあります。防寒着姿で安全な場所にスマホを固定し、「今朝の●●市は（気温など）度！寒いですが、この景色を見てください」と伝えてみましょう。「暖かくして、今日も元気にいってらっしゃい！」と朝の挨拶で締める展開はいかがでしょうか。"}, {"id": "L-12", "category": "じもとのこと", "title": "商店街のユニークな看板やアートに注目", "advice": "普段は通り過ぎてしまう商店街のレトロな看板や壁画には、まちの個性がぎゅっと詰まっています。必ずお店の許可を取ってから、通行の妨げにならない位置で撮影しましょう。「●●市の（商店街名）で、ずっと気になっている（看板やアート）を紹介します！」と切り出し、まち歩きの楽しさを伝えてみてください。"}, {"id": "L-13", "category": "じもとのこと", "title": "地元の方言、これ標準語でどう言う？", "advice": "地域独特の方言やイントネーションは、地元の人同士が一瞬で打ち解けられる温かいコミュニケーションツールです。自宅や事務所で「●●市でよく使う『（方言）』、よその人に通じなくて驚いたことありませんか？」と笑顔で話しかけてみましょう。「意味は（標準語の意味）です。方言ってやっぱりいいですよね」とくすっと笑えるトーンで締めてみてください。"}, {"id": "L-14", "category": "じもとのこと", "title": "地域回りの合間に！地元の定番ランチ", "advice": "日々の政治活動のエネルギー源になる地元食堂のランチ紹介は、人柄と地域愛が同時に伝わる人気企画です。お店の許可を取ってから、料理を前に「今日のランチは（お店の名前）の（メニュー名）です！」と紹介しましょう。「午後からの活動もこれで頑張れます」と前向きに締めると、応援したくなる動画になります。"}, {"id": "L-15", "category": "じもとのこと", "title": "世代を超えて愛される地元の公園", "advice": "朝の散歩から休日のピクニックまで、公園はそのまちの暮らしの豊かさを映す場所です。他の利用者や子どもが映り込まない時間帯・角度で三脚を固定し、「●●市の（公園名）、実は（季節の花や見晴らしなどのおすすめポイント）が最高なんです」と紹介してみてください。「ちょっと一息つきたいときにぜひ」と穏やかに語りかけてみましょう。"}, {"id": "L-16", "category": "じもとのこと", "title": "道の駅・直売所の「朝イチ」おすすめ品", "advice": "道の駅や農産物直売所は、朝一番に行くと新鮮な地元食材や人気のお惣菜に出会えるワクワク空間です。施設の許可を取ってから外観や購入品を紹介するか、帰宅後にテーブルへ並べて撮影しましょう。「●●市の（施設名）で朝イチに狙いたいのは（商品名）！すぐ売り切れるので早起きしました」と軽やかに話してみてください。"}, {"id": "L-17", "category": "じもとのこと", "title": "地元を走るローカル線・路線バスの魅力", "advice": "地域を走る電車やバスは、単なる移動手段ではなく、車窓の風景や思い出が詰まったまちのシンボルです。駅構内や車内での撮影は許可が必要なため、安全な公道から車両が見えるタイミングや自宅で語りましょう。「●●市を走る（路線名）、特に（おすすめの区間や風景）の景色が大好きなんです」と愛着を込めて語ってみてください。"}, {"id": "L-18", "category": "じもとのこと", "title": "手土産に迷ったらこれ！地元の銘菓", "advice": "「地元の美味しいお土産」を知っていることは、地域の魅力を語れる候補者としての大きな強みになります。お店の許可を取ってから紹介するか、自分で購入したお菓子を自宅で開封しながら語りましょう。「県外の友達に●●市の（銘菓名）を渡すと、毎回すごく喜ばれるんです」と、味の特徴を自分の言葉で伝えてみてください。"}, {"id": "L-19", "category": "じもとのこと", "title": "地域の神社・お寺で感じる四季の移ろい", "advice": "地域を見守り続けてきた神社やお寺の境内は、季節ごとの木々や行事でまちの移ろいを感じられる静かな名所です。必ず施設の許可を取ってから、参拝客が映らない画角で撮影してください。「●●市の（神社・お寺名）に来ると、背筋がすっと伸びますね。（見どころや季節の風景）がとてもきれいです」と落ち着いたトーンで伝えてみましょう。"}, {"id": "L-20", "category": "じもとのこと", "title": "地元で頑張る農家さん・漁師さんの旬の話", "advice": "地域の食を支える一次産業の現場には、季節ごとの苦労と誇りが詰まっています。私有地には勝手に入らず、許可を得てお話を伺ったあと自宅や事務所で振り返る形でも十分伝わります。「今、●●市の（農作物・海産物）がちょうど（収穫・漁の時期）を迎えています。作り手の皆さんの工夫に感動しました！」と感謝を込めて語ってみてください。"}, {"id": "L-21", "category": "じもとのこと", "title": "雨の日でも楽しめる地元の室内スポット", "advice": "雨の週末に「どこに行こうかな」と迷う子育て世代やシニア世代にとって、室内スポットの情報はとても重宝されます。施設内で撮る場合は必ず許可を取ってから、あるいは自宅でリストを紹介する形で撮影しましょう。「雨の日の●●市、私のおすすめは（資料館・図書館・商業施設など）です。意外と知らない（楽しみ方）があるんですよ」と提案してみてください。"}, {"id": "L-22", "category": "じもとのこと", "title": "地元ラーメン・ご当地麺の推しトーク", "advice": "ラーメンやうどん、そばなどの麺類は、地元の人同士で一番盛り上がる話題のひとつです。お店の許可を取ってから丼を映すか、自宅で「●●市の麺といえば、皆さんはどこ派ですか？」と語りかけてみましょう。「私は（お店の名前）の（メニュー名）を定期的に食べたくなります！」と笑顔で話すと、コメント欄も賑わいやすくなります。"}, {"id": "L-23", "category": "じもとのこと", "title": "昔と今でこんなに変わった！地元の記憶", "advice": "「昔ここに〇〇があったよね」という記憶の共有は、地元で長く暮らす方々との距離を一気に縮めてくれます。自宅や事務所で「●●市の（駅前や大通りなど）、（〇年）前は（昔の風景）でしたよね！」と懐かしそうに語ってみましょう。「変わらない良さを残しつつ、これからもっと素敵なまちにしていきたいです」と前向きに締めるのもいいですね。"}, {"id": "L-24", "category": "じもとのこと", "title": "夜の街灯り・イルミネーションがきれいな場所", "advice": "冬のイルミネーションや夜のライトアップは、寒い季節にまちを温かく彩ってくれる嬉しい景色です。夜の安全な歩道で通行人が映らない角度にスマホを固定し、「●●市の（場所名）、夜のライトアップがとてもきれいなんです！」と紹介してみてください。「お帰りの際にちょっと見上げてみてくださいね」と優しい一言を添える展開はいかがでしょうか。"}, {"id": "L-25", "category": "じもとのこと", "title": "地元にゆかりのある偉人・有名人の話", "advice": "自分のまちにゆかりのある歴史上の人物や文化人を知ると、地元への誇りがぐっと高まります。自宅の本棚や資料を横に置いて、「実は●●市には（偉人・有名人の名前）にまつわる（エピソードや場所）があるのをご存じですか？」と切り出してみましょう。「地元の歴史を掘り下げると、まだまだ知らない魅力が出てきますね」と明るく締めてみてください。"}, {"id": "L-26", "category": "じもとのこと", "title": "商店街の八百屋・魚屋・肉屋の会話が楽しい", "advice": "対面販売の個人商店には、「今日はこれが旬だよ」「こう料理すると美味しいよ」という温かいやり取りがあります。お店の許可を取ってから撮影し、「●●市の（お店の名前）でお買い物すると、いつも元気をもらえます」と紹介してみましょう。ネット通販にはない地域商店街ならではの良さを、笑顔で伝えてみてください。"}, {"id": "L-27", "category": "じもとのこと", "title": "夏の暑さを吹き飛ばす！地元の冷たいスイーツ", "advice": "うだるような夏の昼間には、地元のジェラートやかき氷、ソフトクリームの話題が画面越しにも涼を届けてくれます。お店の許可を取ってから購入品を紹介し、「暑い日が続きますね！●●市の（お店の名前）の（スイーツ名）でクールダウンしています」と明るく話してみましょう。「皆さんも無理せず涼んでくださいね」と気遣いを添えるのもいいですね。"}, {"id": "L-28", "category": "じもとのこと", "title": "秋の紅葉、人混みを避ける地元の穴場", "advice": "紅葉シーズンになると観光地は混み合いますが、地元民ならではの「静かに秋を味わえる穴場」は喜ばれる情報です。秋の晴れた日に安全な場所でスマホを固定し、「●●市で紅葉を見るなら、（穴場スポット名）もおすすめですよ」と紹介してみてください。「真っ赤な葉っぱを見ると、秋が深まったなと感じますね」と季節感をたっぷり届けましょう。"}, {"id": "L-29", "category": "じもとのこと", "title": "年末年始の地元恒例行事と初詣スポット", "advice": "大晦日の除夜の鐘や初詣、どんど焼きなど、年末年始の地域行事は一年の節目を共有する大切な時間です。神社やお寺で撮る場合は施設の許可を取ってから、あるいは自宅で「●●市のお正月といえば（行事や場所）ですよね」と語ってみましょう。「今年も皆さんにとって笑顔の多い一年になりますように！」と晴れやかに締めてみてください。"}, {"id": "L-30", "category": "じもとのこと", "title": "地元カフェ・喫茶店のほっと一息メニュー", "advice": "昔ながらの純喫茶や新しくできたカフェは、まちの空気を感じながら作戦会議や読書ができる素敵な居場所です。必ずお店の許可を取ってから、テーブルにスマホを固定して「活動の合間に（お店の名前）で（ドリンクや軽食）をいただいています」と紹介しましょう。「落ち着いた空間でアイデアを整理する時間が大好きです」と人柄も覗かせてみてください。"}, {"id": "L-31", "category": "じもとのこと", "title": "まちを見守り続けるシンボルツリー・名木", "advice": "何百年も前からその場所に立ち続ける大木や並木道は、地域の移り変わりを見守ってきた静かなシンボルです。私有地に入らず安全な場所から固定撮影し、「●●市の（場所名）にあるこの（木の種類・名前）、実は樹齢（年数など）年と言われているそうです」と紹介してみましょう。「見上げるだけでパワーをもらえますよ」と穏やかに語ってみてください。"}, {"id": "L-32", "category": "じもとのこと", "title": "地元のお祭りグルメ・屋台の思い出トーク", "advice": "お祭りの時期になると食べたくなるご当地屋台グルメは、世代を超えて「わかる！」と盛り上がるテーマです。自宅や事務所で「●●市のお祭りに行ったら、皆さんはまず何を食べますか？」と問いかけてみましょう。「私は（定番グルメ名）の匂いがしてくると、一気にテンションが上がります！」とくすっと笑える軽さで話してみてください。"}, {"id": "L-33", "category": "じもとのこと", "title": "休日に行きたい！地元の温泉・銭湯の魅力", "advice": "地元の温泉や昔ながらの銭湯は、体の疲れを癒やすだけでなく、地域の人同士が裸の付き合いをする温かな社交場です。脱衣所や浴室はもちろん撮影禁止のため、施設の許可を取った外観前か自宅で語りましょう。「一日歩き回った日は、●●市の（施設名）のお湯が最高なんです」とリラックスした表情で紹介する展開はいかがでしょうか。"}, {"id": "L-34", "category": "じもとのこと", "title": "地元スポーツチームや市民マラソンを応援", "advice": "地域のスポーツチームや市民マラソン大会は、まち全体が一体となって盛り上がれる素晴らしい機会です。自宅や事務所でタオルやグッズを手に持ち（チームロゴ等の扱いに配慮しつつ）、「今週末は●●市の（大会名やチーム名）ですね！私も全力で応援しています」と元気に伝えてみましょう。「スポーツの力でまちを明るくしたいですね」と締めるのもいいですね。"}, {"id": "L-35", "category": "じもとのこと", "title": "まちで見つけた「ちょっと面白い風景」", "advice": "ユニークなデザインのマンホールや、思わず二度見してしまうオブジェなど、まちの小さな発見はSNSで人気が出やすいネタです。私有地やお店に関わる場合は許可を取ってから、安全な場所で立ち止まって撮影しましょう。「●●市を歩いていて見つけた（マンホールやモニュメント）、よく見ると（面白いポイント）なんです！」と楽しそうに紹介してみてください。"}, {"id": "L-36", "category": "じもとのこと", "title": "地元の川・海・山、季節ごとの表情", "advice": "身近にある自然の風景は、毎日見ているからこそ当たり前になりがちですが、改めて言葉にするとその美しさに気づけます。安全な場所（河川敷の遊歩道や展望台など）でスマホを固定し、「●●市の（川・海・山の名前）、今の季節は（季節の特徴）がとてもきれいなんです」と紹介しましょう。「この豊かな自然を次の世代にも残したいですね」と温かく締めてみてください。"}, {"id": "L-37", "category": "じもとのこと", "title": "地元の伝統工芸・ものづくりの手仕事", "advice": "地域に受け継がれる伝統工芸品や町工場のオリジナル製品には、職人さんの技と誇りが宿っています。工房やお店の許可を取ってから撮影するか、自分が愛用している品を自宅で紹介しましょう。「●●市で作られている（工芸品・製品名）、実際に使ってみると（使い心地や魅力）がすごいんです」と、地元のものづくりを応援する気持ちを伝えてみてください。"}, {"id": "L-38", "category": "じもとのこと", "title": "家族と語る「地元のここが好き！」3選", "advice": "候補者ひとりで語るのとは違い、家族との掛け合いは自然体の笑顔が引き出され、親近感がぐっと高まります。自宅のリビングでスマホを固定し、カメラの横にいる家族と「●●市の好きなところ3つ挙げてみよう！」とテンポよく話してみましょう。「1つ目は（場所や食べ物）、2つ目は（人の温かさなど）…」と仲の良さが伝わる展開はいかがでしょうか。"}, {"id": "L-39", "category": "じもとのこと", "title": "昼の商店街で発見した新しいお店", "advice": "新しくオープンしたお店を紹介することは、地域で挑戦する人を応援する姿勢にもつながります。必ずお店の許可を取ってから店先で立ち止まって撮影し、「●●市の（エリア名）に新しくできた（お店の名前）さんにお邪魔しました！」と明るく伝えてみましょう。「まちに新しい風が吹くとワクワクしますね」と前向きに締めるのもいいですね。"}, {"id": "L-40", "category": "じもとのこと", "title": "冬のあったかグルメ！地元の鍋・汁物", "advice": "寒い冬の日に体を芯から温めてくれるご当地の鍋料理や汁物、ほかほかの肉まんなどは、見ているだけでホッとするネタです。お店の許可を取ってから撮影するか、自宅で作った郷土料理を前に語りましょう。「寒い日の●●市といえば、やっぱり（料理名）！これがあると冬を乗り切れます」と笑顔で伝えてみてください。"}, {"id": "L-41", "category": "じもとのこと", "title": "地域の公民館・図書館の意外な活用法", "advice": "公民館や図書館には、本を借りるだけでなく、地域の歴史資料コーナーや趣味のサークル掲示板など意外と知られていない魅力があります。施設内で撮る場合は必ず許可を取ってから、あるいは自宅で「●●市の（施設名）、実は（便利なサービスや面白いコーナー）があるって知ってましたか？」と紹介してみましょう。暮らしに役立つ地元情報として喜ばれます。"}, {"id": "L-42", "category": "じもとのこと", "title": "地元に伝わる昔話・民話を1分で紹介", "advice": "その土地に語り継がれてきた昔話や伝説は、地域のルーツを知る楽しい入り口になります。自宅の落ち着いた部屋でスマホを固定し、「●●市に伝わる（昔話のタイトル）、知っていますか？実はこんなお話なんです」と紙芝居のように分かりやすく語ってみましょう。「子どもたちに語り継いでいきたい地元の宝物ですね」と優しく締めてみてください。"}, {"id": "L-43", "category": "じもとのこと", "title": "朝のおすすめウォーキングコース", "advice": "健康づくりを兼ねて地域を歩くコースの紹介は、朝の爽やかなイメージとともに地元の歩きやすさを伝える良い機会です。歩きながらではなく、スタート地点や景色のいい場所で立ち止まって固定撮影しましょう。「私のお気に入りの朝コースは（コース名）です。（見どころや気持ちよさ）があって、朝から元気が出ますよ」と紹介する展開はいかがでしょうか。"}, {"id": "L-44", "category": "じもとのこと", "title": "地元の花屋さん・園芸店で季節を感じる", "advice": "街角の花屋さんや園芸店の店先は、季節の移り変わりを色鮮やかに教えてくれる素敵なスポットです。必ずお店の許可を取ってから撮影するか、買ってきた花を事務所に飾って紹介しましょう。「●●市の（お店の名前）で（季節の花）を見つけました！お花があると部屋も気持ちも明るくなりますね」と優しい笑顔で語りかけてみてください。"}, {"id": "L-45", "category": "じもとのこと", "title": "友達に自慢したい「推し景色」ベスト3", "advice": "「地元のいいところを3つに絞って紹介する」カウント形式は、テンポがよく最後まで見てもらいやすい構成です。自宅や事務所で指を折りながら、「●●市に友達が来たら絶対案内したい景色ベスト3！」と発表してみましょう。「3位は（場所①）、2位は（場所②）、そして1位は（場所③）です！」と、地元愛をまっすぐ伝えてみてください。"}, {"id": "L-46", "category": "じもとのこと", "title": "地域の清掃活動・花壇づくりに参加して", "advice": "町内会の清掃活動や花壇の手入れなど、地域をきれいに保つ日々の活動は、まちへの愛着を育む大切な時間です。他の参加者の顔が大きく映らないよう配慮し、活動前後に立ち止まって「今日は（地域名）の（活動内容）に参加しました！」と報告しましょう。「みんなで汗を流すと、まちがもっと好きになりますね」と爽やかに締めるのもいいですね。"}, {"id": "L-47", "category": "じもとのこと", "title": "地元の本屋さん・文房具屋さんの魅力", "advice": "街の本屋さんや文房具屋さんには、ネット検索では出会えない「偶然の面白い1冊」や店主こだわりの品揃えがあります。お店の許可を取ってから撮影するか、購入した本やペンを自宅で手に取りながら話しましょう。「●●市の（お店の名前）で見つけた（商品名）、こういう出会いが街のお店の良さですよね」と温かく紹介してみてください。"}, {"id": "L-48", "category": "じもとのこと", "title": "夕方の帰宅路、ほっとする地元のお惣菜屋さん", "advice": "仕事や活動の帰り道に「あと一品！」と頼りになる地元のお惣菜屋さんは、忙しい家庭の強い味方です。お店の許可を取ってから外観を紹介するか、買ってきたお惣菜を自宅の食卓に並べて撮影しましょう。「夕方になると吸い寄せられてしまう（お店の名前）の（コロッケや煮物など）、今日も最高に美味しいです！」と親しみやすく語ってみてください。"}, {"id": "L-49", "category": "じもとのこと", "title": "県外から来た人に絶対食べてほしい地元グルメ", "advice": "「外から来た人にこれを食べてほしい！」という視点で語ると、地元の食文化の誇らしさが自然と伝わります。自宅や事務所、あるいは停車中の車内などで「もし県外から●●市に遊びに来たら、まずは（ご当地グルメ名）を食べてほしいです！」と熱弁してみましょう。「理由は（美味しさのポイント）だから。地元の自慢の味です！」と笑顔で締めてみてください。"}, {"id": "L-50", "category": "じもとのこと", "title": "「●●市あるある」みんなで共感トーク！", "advice": "その地域に住んでいる人なら思わず「わかる〜！」と笑ってしまう「地元あるある」は、一番親近感がわく定番ネタです。自宅や事務所でリラックスしながら、「●●市あるあるを1つ言いますね。（例：特定の交差点の混み方、天気の特徴、地元の合言葉など）、これ共感してくれますか？」と語りかけてみましょう。「皆さんのあるあるもぜひ教えてください！」と締める展開はいかがでしょうか。"}, {"id": "D-01", "category": "日常・自己紹介", "title": "朝の駅立ち、実は何時に起きている？", "advice": "朝の駅立ちを続けている候補者の裏側は、見ている人にとって意外と気になるポイントです。自宅や駅前の安全な場所でスマホを固定し、「実は毎朝（起床時間）に起きて準備しています！」と笑顔で明かしてみましょう。「眠い日もありますが、皆さんの『おはよう』で一気に目が覚めます」と前向きに締める展開はいかがでしょうか。"}, {"id": "D-02", "category": "日常・自己紹介", "title": "立候補を決めた「あの日」のきっかけ", "advice": "「なぜわざわざ大変な政治の世界に？」という疑問は、有権者が最初に抱く素朴な関心事です。自宅の落ち着いた部屋で、「私が●●市のために動こうと決めたのは、（きっかけになった出来事）があったからです」と飾らない言葉で語ってみましょう。深刻になりすぎず、「黙って見ているより、自分で動いた方が早いと思ったんです」と軽やかに締めるのもいいですね。"}, {"id": "D-03", "category": "日常・自己紹介", "title": "政治活動のカバンの中身、全部見せます！", "advice": "普段持ち歩いている道具を見せると、日々の活動のリアルさや人柄が一瞬で伝わります。事務所や自宅の机にスマホを固定し、カバンから1つずつ取り出しながら「チラシ、メモ帳、水筒、そして秘密兵器の（こだわりアイテム）！」とテンポよく紹介してみてください。「意外と荷物が多いんです」とくすっと笑える一言を添えるのがおすすめです。"}, {"id": "D-04", "category": "日常・自己紹介", "title": "初めて駅に立った日のちょっとした失敗談", "advice": "完璧な人よりも、ちょっとした失敗を笑って話せる人の方が親近感を持たれやすいものです。自宅や事務所で「初めて（駅名）に立った日、実は（マイクの電源を入れ忘れた、声が裏返ったなどの失敗）をやらかしました！」と明るく告白してみましょう。「あの日のドキドキを忘れず、今も初心で頑張っています」と前向きにつなげてみてください。"}, {"id": "D-05", "category": "日常・自己紹介", "title": "私の名前、漢字の由来と覚え方", "advice": "種まき期の一番の目的は、まず顔と名前を覚えてもらうことです。紙に自分の名前を大きく書いて見せながら、「私の名前は（フルネーム）、（漢字の由来やユニークな覚え方）と覚えてもらえると嬉しいです！」と明るく紹介しましょう。「街で見かけたらぜひ『（下の名前やニックネーム）』と気軽に声をかけてください」と締める展開はいかがでしょうか。"}, {"id": "D-06", "category": "日常・自己紹介", "title": "今の仕事・前職で鍛えられた私の特技", "advice": "これまでの仕事経験は、候補者ならではの強みと信頼感につながる大切なアピールポイントです。仕事道具やノートを手に持ちながら、「私はこれまで（職種・業界）で働いてきました。そこで鍛えられた（人の話を聞く力、段取り力などの特技）が武器です！」と語ってみましょう。「この経験を●●市の活動にも活かします」と締めてみてください。"}, {"id": "D-07", "category": "日常・自己紹介", "title": "休日のリフレッシュ方法、これだけは譲れない！", "advice": "政治の話ばかりでなく、オフの日の素顔を見せることで「同じまちに暮らす一人の人間」として親しみやすくなります。自宅のリビングでリラックスした服装のまま、「休みの日に一番テンションが上がるのは（趣味やリフレッシュ法）をしている時間です！」と笑顔で話してみてください。「皆さんのリフレッシュ方法も教えてくださいね」と問いかけるのもいいですね。"}, {"id": "D-08", "category": "日常・自己紹介", "title": "駅立ちで一番嬉しかった「あの一言」", "advice": "日々の活動で地域の方からもらった温かい言葉は、見ている人にも優しい気持ちを届けます。駅立ち後の自宅や停車中の車内で、「今日、（駅名や地域）で活動していたら、『（かけてもらった嬉しい一言）』と声をかけてもらいました！」と嬉しそうに報告してみましょう。「その一言で疲れが吹き飛びました。ありがとうございます！」と感謝で締めてみてください。"}, {"id": "D-09", "category": "日常・自己紹介", "title": "家族に立候補を相談したときのリアルな反応", "advice": "家族とのやり取りには、その人の誠実さや普段のキャラクターがそのまま表れます。自宅のテーブルにスマホを固定し、「実は家族に『政治活動を始めたい』と話したとき、最初は『（家族のリアルな反応）』と言われました」と正直に語ってみましょう。「でも今は一番の応援団になってくれています」と感謝を添えると、温かい印象が残ります。"}, {"id": "D-10", "category": "日常・自己紹介", "title": "私の勝負メシ！活動前の朝ごはん", "advice": "毎日の食事の話題は、生活感が出て見ている人がほっと安心する鉄板ネタです。朝の自宅ダイニングで、食べる前の朝ごはんを前にスマホを固定し、「今日も元気に動くための勝負メシは（朝ごはんメニュー）です！」と紹介してみましょう。「しっかり食べて、今日も●●市を回ってきます！」と爽やかにスタートする展開はいかがでしょうか。"}, {"id": "D-11", "category": "日常・自己紹介", "title": "スマホ1台で撮影中！動画づくりの裏側", "advice": "「お金もスタッフもないけれど、工夫して発信している」という等身大の姿は、むしろ応援したくなる魅力になります。事務所や自宅で三脚を指さしながら、「実はこの動画、いつもスマホ1台と三脚だけで撮ってるんです！」と裏側を明かしてみましょう。「編集も勉強中ですが、●●市の皆さんに届くようコツコツ続けます」と笑顔で語ってみてください。"}, {"id": "D-12", "category": "日常・自己紹介", "title": "実は苦手なんです…私のちょっと意外な弱点", "advice": "ちょっとした弱点や苦手なことを笑い話にすると、グッと距離が縮まり人間味が増します。自宅や事務所で「実は私、（早起き、虫、方向音痴など可愛い弱点）が大の苦手なんです…」とくすっと笑えるトーンで打ち明けてみましょう。「そんな私ですが、（得意なことや頑張っていること）だけは誰にも負けません！」と前向きに返してみてください。"}, {"id": "D-13", "category": "日常・自己紹介", "title": "地域回りの相棒、スニーカーのこだわり", "advice": "自分の足で地域を回っていることは、靴を見せるだけで言葉以上に説得力を持って伝わります。玄関や事務所で愛用しているスニーカーを手に持ち、「地域回りの一番の相棒がこの靴です！もう（歩いた距離や期間）も一緒に歩いています」と紹介してみましょう。「靴底が減るほど●●市の声を聞いて回ります！」と元気よく締めるのもいいですね。"}, {"id": "D-14", "category": "日常・自己紹介", "title": "停車中の車内でホッと一息、今日の振り返り", "advice": "地域回りの直後に撮る動画は、その日の熱量やリアルな表情がそのまま伝わる良質なコンテンツになります。必ず駐車場に完全停車し、エンジンを切った状態でスマホを固定してから、「今日は（エリア名）を回ってきました！印象に残ったのは（今日の気づき）です」と語ってみましょう。「明日も元気に走ります！」と爽やかに締めてみてください。"}, {"id": "D-15", "category": "日常・自己紹介", "title": "支援者さんから見た「私ってどんな人？」", "advice": "自分で自分を褒めるのは照れくさいですが、支援者さんからの一言なら自然に人柄が伝わります。事務所でスマホを固定し、カメラの横に座った支援者さんに「私を一言で表すとどんな人ですか？」と聞いてみましょう。「（支援者さんの回答）」に少し照れ笑いしながら、「期待に応えられるよう頑張ります！」と返す掛け合いが微笑ましいです。"}, {"id": "D-16", "category": "日常・自己紹介", "title": "冬の駅立ち、最強の防寒グッズ3選", "advice": "寒い冬の朝に外で活動するための工夫は、通勤・通学する人にとっても役立つ生活情報になります。冬の朝、自宅の玄関や事務所で指を折りながら、「冬の駅立ちを乗り切る私の三種の神器！1つ目は（カイロや手袋など）、2つ目は（インナーなど）、3つ目は（温かい飲み物など）です」と紹介してみてください。「皆さんも暖かくしてお出かけくださいね」と労いも添えましょう。"}, {"id": "D-17", "category": "日常・自己紹介", "title": "夏の駅立ち、暑さを乗り切るマイアイテム", "advice": "夏の猛暑の中での活動は、無理をせずしっかり対策している姿を見せることが安心感につながります。夏の朝や昼、涼しい室内で冷感タオルや水筒を手に持ち、「この暑さを乗り切る相棒は（マイアイテム）です！」と明るく紹介してみましょう。「こまめな水分補給を忘れずに、一緒に夏を乗り切りましょう！」と呼びかける展開はいかがでしょうか。"}, {"id": "D-18", "category": "日常・自己紹介", "title": "子どもの頃の夢と、今の自分", "advice": "子どもの頃の夢を語ると、その人の原点や純粋な思いが伝わり、世代を問わず温かい気持ちになります。自宅の部屋で「子どもの頃の私の夢は（昔の夢）でした。まさか今こうして●●市のまちづくりに挑戦するとは！」と笑顔で振り返ってみましょう。「形は違っても、（人を喜ばせたいなどの共通点）は今も変わっていません」と締めてみてください。"}, {"id": "D-19", "category": "日常・自己紹介", "title": "最近読んで心に残った1冊の本", "advice": "愛読書を紹介することで、その人がどんな価値観を大切にしているのかが自然と伝わります。自宅の本棚の前で本を手に持ち、「最近読んで『これいいな！』と思ったのが（本のタイトル）です」と紹介してみましょう。「特に（心に残ったフレーズや学び）に共感しました。おすすめの1冊があればぜひ教えてください」と広げると交流が生まれます。"}, {"id": "D-20", "category": "日常・自己紹介", "title": "チラシ配りで学んだ「受け取ってもらえるコツ」", "advice": "街頭でチラシを受け取ってもらう難しさと工夫を語ると、地道に頑張る姿への共感が集まります。事務所で自分のチラシを手に持ち、「最初はなかなか受け取ってもらえなかったんですが、（笑顔で目を見る、一言添えるなどのコツ）を意識したら変わりました！」と明るく話してみてください。「見かけたらぜひ1枚受け取っていただけると嬉しいです」と軽やかに締めるのもいいですね。"}, {"id": "D-21", "category": "日常・自己紹介", "title": "私の座右の銘、落ち込んだときの言葉", "advice": "誰にでもうまくいかない日はありますが、そんな時に支えになる言葉を知ると人柄への信頼感が増します。紙に座右の銘を書いて見せながら、「うまくいかない日にいつも思い出す言葉が『（座右の銘）』です」と紹介してみましょう。「この言葉のおかげで、また明日から前を向けるんです」と等身大のトーンで語ってみてください。"}, {"id": "D-22", "category": "日常・自己紹介", "title": "1日のスケジュール、朝から夜まで公開！", "advice": "「政治活動って普段何をしてるの？」という素朴な疑問に、1日の流れで答える分かりやすい企画です。事務所のホワイトボードやノートにタイムスケジュールを書いて見せ、「朝（〇時）の駅立ちから始まり、昼は（地域回りや仕事）、夜は（勉強会や動画編集）！」とテンポよく紹介してみてください。「忙しいけど充実した毎日です」と笑顔で締めてみましょう。"}, {"id": "D-23", "category": "日常・自己紹介", "title": "料理は得意？苦手？自宅キッチンの日常", "advice": "キッチンでの何気ないひとコマは、暮らしの目線を持っていることが自然と伝わる親しみやすいネタです。自宅のキッチンや食卓でスマホを固定し、「実は私の得意料理は（料理名）です！（または、料理は修行中ですが（簡単な一品）だけは自信あり！）」と明るく紹介してみましょう。「忙しい日の時短レシピがあればぜひ教えてください」と締める展開はいかがでしょうか。"}, {"id": "D-24", "category": "日常・自己紹介", "title": "声がかれないように気をつけている喉ケア", "advice": "毎日大きな声で挨拶や演説をする活動ならではの工夫は、「なるほど！」と興味を持ってもらいやすい話題です。自宅や事務所でお気に入りののど飴や温かい飲み物を見せながら、「毎日しゃべるので、喉ケアは死活問題です！私は（自分の喉ケア方法）を欠かしません」と笑いを交えて紹介してみてください。「季節の変わり目、皆さんもご自愛くださいね」と気遣いも添えましょう。"}, {"id": "D-25", "category": "日常・自己紹介", "title": "家族から見た「私の直してほしいところ」", "advice": "家族からのちょっとしたダメ出しは、飾らない素顔が見えて一番くすっと笑える人気企画です。自宅のリビングでスマホを固定し、カメラの外にいる家族に「私の直してほしいところ、1つだけ教えて！」と聞いてみましょう。「（靴下を脱ぎっぱなし、熱中しすぎるなどの回答）」に苦笑いしながら、「はい、気をつけます！」と返すやり取りが好感度抜群です。"}, {"id": "D-26", "category": "日常・自己紹介", "title": "事務所（または自宅デスク）のこだわり紹介", "advice": "普段作業している机の上を見せると、活動の裏側をのぞき見する楽しさが生まれます。個人情報が映らないよう整理してからスマホを固定し、「ここが私の作戦基地です！一番のお気に入りは（地図、付箋、マグカップなど）」と紹介してみましょう。「ここで毎日●●市の未来をあれこれ考えています」とワクワク感を伝えてみてください。"}, {"id": "D-27", "category": "日常・自己紹介", "title": "初めてSNS動画を出したときのビフォーアフター", "advice": "成長の過程を見せる「ビフォーアフター」は、見守ってくれている人の応援意欲を高める切り口です。自宅や事務所で「最初に動画を撮ったときは（ガチガチに緊張していた様子を少し再現）でした！」と笑いを交えて振り返ってみましょう。「少しは慣れてきましたかね？これからも分かりやすく発信していきます！」と明るく締めてみてください。"}, {"id": "D-28", "category": "日常・自己紹介", "title": "運動不足解消！私の健康ルーティン", "advice": "元気に地域を回り続けるための体力づくりは、健康に関心の高い幅広い世代から共感を得やすいテーマです。自宅の部屋や安全な公園（他人が映らない画角）でストレッチをしながら、「体が資本なので、毎朝（スクワットやストレッチなど）を続けています！」と紹介してみましょう。「三日坊主にならないよう、ここで宣言しておきます！」とくすっと笑える締めにすると楽しいです。"}, {"id": "D-29", "category": "日常・自己紹介", "title": "雨の日の政治活動、どうやって工夫してる？", "advice": "雨の日にどんな工夫をして活動しているかを話すと、コツコツ続ける誠実さが伝わります。雨の日の玄関先（濡れない安全な場所）や事務所でレインコートや長靴を見せながら、「雨の日は（駅立ちの工夫や室内での勉強・準備など）に切り替えて動いています」と報告してみましょう。「足元が滑りやすいので、皆さんもお気をつけて！」と優しい一言を添えてみてください。"}, {"id": "D-30", "category": "日常・自己紹介", "title": "好きな音楽・作業用BGMでテンションアップ", "advice": "好きな音楽の話題は、同じ趣味の人と一瞬でつながれる楽しい自己紹介になります。著作権に配慮して曲は流さず、自宅や事務所で「朝、気合を入れたいときは（アーティスト名や曲のジャンル）を聴いています！」と語ってみましょう。「これを聴くと『よし、今日も行くぞ！』とスイッチが入るんです」と笑顔で話してみてください。"}, {"id": "D-31", "category": "日常・自己紹介", "title": "地域を回っていて気づいた「自分の変化」", "advice": "活動を始めてから自分自身がどう変わったかを振り返ると、等身大の成長ストーリーとして心に響きます。夕方の落ち着いた時間に自宅や事務所で、「政治活動を始めて（〇か月）、一番変わったのは（まちの見え方や人との話し方などの変化）です」と語ってみましょう。「毎日が発見の連続で、●●市がますます好きになりました」と温かく締めるのもいいですね。"}, {"id": "D-32", "category": "日常・自己紹介", "title": "春の新年度、新しい手帳に書いた目標", "advice": "春は新しいことを始める人が多く、目標を共有すると前向きなエネルギーが伝わります。春の時期に自宅の机で新しい手帳を開きながら、「新年度になりましたね！私の手帳の1ページ目に書いた目標は『（今年の具体的な目標）』です」と紹介してみましょう。「皆さんの新年度の目標も、ぜひコメントで教えてください！」と呼びかけてみてください。"}, {"id": "D-33", "category": "日常・自己紹介", "title": "秋の夜長、政策アイデアを練る時間", "advice": "秋の涼しい夜は、少し落ち着いたトーンで自分の思いや学びを語るのにぴったりの季節感が出ます。夜の自宅デスクで温かい飲み物をそばに置き、「秋は夜が長くて、調べ物やアイデア整理がはかどりますね。今夜は（調べているテーマ）についてまとめています」と静かに語ってみましょう。「まとまったらまた動画でお伝えしますね」と次回へつなげるのもいいですね。"}, {"id": "D-34", "category": "日常・自己紹介", "title": "年末年始の過ごし方、我が家の恒例ルール", "advice": "年末年始の家庭の過ごし方は、地域の文化や家族の温かさが伝わるほっこりしたネタになります。自宅のリビングで「我が家のお正月の恒例は（お雑煮の具、初詣の順番、親戚との過ごし方など）です！」と楽しそうに話してみてください。「皆さんはどんな年末年始を過ごされますか？良いお年を！（または今年もよろしくお願いします！）」と季節の挨拶で締めましょう。"}, {"id": "D-35", "category": "日常・自己紹介", "title": "学生時代の部活・サークルで学んだこと", "advice": "学生時代に打ち込んだ部活やサークルの話は、その人の粘り強さやチームワークの原点が伝わる定番の自己紹介です。自宅や事務所で「私は学生時代、（部活・サークル名）に夢中でした！そこで学んだ（諦めない心や仲間との協力など）が今の活動の土台です」と語ってみましょう。「同じ部活だった方、いらっしゃいますか？」と問いかけるのも楽しいです。"}, {"id": "D-36", "category": "日常・自己紹介", "title": "実はこんな資格・特技を持っています！", "advice": "ちょっと意外な資格や特技を披露すると、「へえ、面白い人だな！」と記憶に残りやすくなります。自宅や事務所で「実は私、（資格名やちょっとした特技）を持っているんです！」と明るく紹介してみましょう。「政治とは関係なさそうに見えて、意外と（役立つ場面）で活きてるんですよ」と笑顔でつなげる展開はいかがでしょうか。"}, {"id": "D-37", "category": "日常・自己紹介", "title": "活動中に必ず持ち歩く「お守りアイテム」", "advice": "家族からもらったものや昔から愛用しているペンなど、心の支えになっているアイテムには素敵なストーリーが宿ります。カメラの前にそっと見せながら、「これ、活動中いつもポケットに入れている（アイテム名）なんです。（まつわるエピソード）なので、触ると落ち着くんです」と優しく語ってみましょう。人柄の温かさがじんわり伝わります。"}, {"id": "D-38", "category": "日常・自己紹介", "title": "よく聞かれる「なぜ政治の世界へ？」に30秒回答", "advice": "初めて動画を見る人に向けて、自分の原点を30秒でスパッと語れる動画はプロフィール代わりになる大切な1本です。自宅や事務所の明るい壁の前で、「よく『なんで政治をやるの？』と聞かれます。理由はシンプルで、（自分の原点となる一言）だからです！」とまっすぐ伝えてみましょう。「●●市をもっと良くしたい気持ちは誰にも負けません」と爽やかに締めてみてください。"}, {"id": "D-39", "category": "日常・自己紹介", "title": "1週間の歩数チェック！今週は何歩歩いた？", "advice": "スマホの歩数計という客観的な数字を見せると、地域を歩いて回っている頑張りが楽しく伝わります。週末の自宅や事務所でスマホの画面（または紙に書いた数字）を見せながら、「今週の歩数を発表します！なんと合計（歩数）歩でした！」と元気よく報告してみましょう。「来週も自分の足で●●市をしっかり歩きます！」と前向きに締めるのもいいですね。"}, {"id": "D-40", "category": "日常・自己紹介", "title": "コーヒー派？お茶派？休憩時間のこだわり", "advice": "ちょっとした好みの話題は、コメント欄で視聴者と気軽にやり取りするきっかけになります。自宅や事務所でマイボトルやマグカップを手に持ち、「活動の合間のホッと一息、私は断然（コーヒー・緑茶・紅茶など）派です！（こだわりの飲み方）が最高なんです」とリラックスして話してみましょう。「皆さんはどちら派ですか？」と軽く問いかけてみてください。"}, {"id": "D-41", "category": "日常・自己紹介", "title": "失敗しても前向きに！私の切り替えスイッチ", "advice": "落ち込んだときの立て直し方を知ると、困難な課題にも粘り強く取り組んでくれそうな頼もしさが伝わります。自宅や事務所で「うまくいかなくてへこんだとき、私は（甘いものを食べる、深呼吸する、散歩するなど）で気持ちを切り替えます！」と明るく話してみましょう。「くよくよしても始まらないので、笑って次へ進みます！」と軽やかに締めてみてください。"}, {"id": "D-42", "category": "日常・自己紹介", "title": "ポスターやチラシの色、なぜこの色に？", "advice": "自分のイメージカラーやチラシのデザインの裏話には、候補者の思いやセンスが表れます。事務所で自分の活動チラシを手に持ち、「よく『なんで（色名）にしたの？』と聞かれるんですが、実は（地域にちなんだ理由や込めた思い）があるんです！」と紹介してみましょう。「街でこの色を見かけたら、私を思い出してもらえると嬉しいです」と笑顔で締めてみてください。"}, {"id": "D-43", "category": "日常・自己紹介", "title": "自分の性格を一言で表すと？", "advice": "自分の性格を分かりやすく一言で表現しておくと、初めて見た人にもキャラクターがすっと入ってきます。自宅や事務所で「自分の性格を一言でいうと『（思い立ったら即行動、おせっかいな聞き役など）』です！」とテンポよく切り出してみましょう。「長所でもあり短所でもありますが、●●市の皆さんのためにこの性格を全開で活かします！」と明るく締める展開はいかがでしょうか。"}, {"id": "D-44", "category": "日常・自己紹介", "title": "夕方の帰宅後、まず最初にやること", "advice": "一日の活動を終えて家に帰った瞬間のルーティンは、親近感と生活リズムのリアルさを伝えてくれます。夕方の自宅リビングで「ただいま帰りました！私が帰宅して一番最初にやるのは（うがい手洗い、着替え、ペットを撫でるなど）です」とホッとした表情で話してみましょう。「今日も一日お疲れさまでした！」と視聴者への労いで締めるのもいいですね。"}, {"id": "D-45", "category": "日常・自己紹介", "title": "これから挑戦してみたい新しいこと", "advice": "現状に満足せず新しいことに挑戦する姿勢は、未来志向の候補者としてとても魅力的な印象を与えます。自宅や事務所で「政治活動とは別に、今年挑戦してみたいのが（料理、楽器、スポーツ、資格など）なんです！」とワクワクした表情で話してみましょう。「いくつになっても新しいことを学ぶのは楽しいですよね」と前向きに締めてみてください。"}, {"id": "D-46", "category": "日常・自己紹介", "title": "感謝を伝えたい、陰で支えてくれる人たち", "advice": "ひとりで頑張っているように見えても、家族や友人、ボランティアさんの支えへの感謝を言葉にできる人は信頼されます。事務所や自宅で少し丁寧なトーンに変え、「いつも私の活動を支えてくれている（家族や仲間、応援してくれる皆さん）、本当にありがとうございます」とまっすぐ伝えてみましょう。「皆さんの応援を力に変えて、明日も頑張ります」と温かく締めてみてください。"}, {"id": "D-47", "category": "日常・自己紹介", "title": "昔のアルバムから振り返る、地元の思い出", "advice": "昔の思い出話には、そのまちで生きてきた時間や地域への深い愛情がにじみ出ます。自宅の机で（他人の顔が映っていない自分の昔の写真や思い出の品があれば見せつつ）、「（〇年前）の●●市で、私は（子ども時代や若い頃の思い出）をして過ごしていました」と懐かしそうに語ってみましょう。「育ててくれたこのまちに、今度は恩返しがしたいんです」と締めるのもいいですね。"}, {"id": "D-48", "category": "日常・自己紹介", "title": "視聴者さんからの質問に答えてみた！", "advice": "SNSのコメントや街頭で寄せられた質問に答える動画は、双方向のコミュニケーションを大切にしている姿勢が伝わります。自宅や事務所でメモを見ながら、「先日『（視聴者からの素朴な質問）』とご質問をいただきました！ありがとうございます」と笑顔で読み上げてみましょう。シンプルに答えたあと、「何でも気軽に聞いてくださいね！」と締める展開はいかがでしょうか。"}, {"id": "D-49", "category": "日常・自己紹介", "title": "1年前の自分に声をかけるとしたら", "advice": "少し過去の自分を振り返る切り口は、これまでの歩みと今の覚悟をドラマチックかつ軽やかに伝えられます。夕暮れの安全な場所や自宅で、「1年前の自分に声をかけるなら、『（大丈夫、素敵な出会いが待ってるよ！などの一言）』と言いたいです」と笑顔で語ってみましょう。「大変なこともありますが、挑戦して本当に良かったと思っています」と前向きに締めてみてください。"}, {"id": "D-50", "category": "日常・自己紹介", "title": "顔と名前を覚えてもらうための30秒自己紹介", "advice": "SNSのプロフィール欄に固定しておける、王道の30秒自己紹介動画は1本あるとずっと活躍します。明るい室内でカメラをまっすぐ見て、「はじめまして！●●市で活動している（フルネーム）です。（出身や経歴）、（大切にしている思い）を胸に毎日走っています！」とテンポよく自己紹介しましょう。「街で見かけたらぜひ気軽に声をかけてください！」と最高の笑顔で締めてみてください。"}];
const LS_KEY = "neta-factory-v1";
let currentCat = "all";
let lastId = null;

const catsEl = document.getElementById("cats");
const cardEl = document.getElementById("card");
const drawBtn = document.getElementById("draw");
const redrawBtn = document.getElementById("redraw");

function pool() {
  return currentCat === "all" ? NETA : NETA.filter(n => n.category === currentCat);
}
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function show(item) {
  cardEl.className = "card";
  cardEl.innerHTML =
    '<span class="chip">' + esc(item.category) + '</span>' +
    "<h3>" + esc(item.title) + "</h3>" +
    '<p class="advice">' + esc(item.advice) + "</p>" +
    '<div class="idx num">' + esc(item.id) + "</div>";
  cardEl.classList.remove("flip");
  void cardEl.offsetWidth; // restart animation
  cardEl.classList.add("flip");
  redrawBtn.classList.add("show");
  lastId = item.id;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ cat: currentCat, id: item.id }));
  } catch (e) {}
}
function draw() {
  let p = pool();
  if (p.length > 1 && lastId) p = p.filter(n => n.id !== lastId);
  const item = p[Math.floor(Math.random() * p.length)];
  show(item);
}
catsEl.addEventListener("click", e => {
  const btn = e.target.closest("button[data-cat]");
  if (!btn) return;
  currentCat = btn.dataset.cat;
  catsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
});
drawBtn.addEventListener("click", draw);
redrawBtn.addEventListener("click", draw);

// restore last drawn neta on this device only
try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if (saved && saved.id) {
    const item = NETA.find(n => n.id === saved.id);
    if (item) {
      if (saved.cat && saved.cat !== "all") {
        currentCat = saved.cat;
        catsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.cat === currentCat));
      }
      show(item);
    }
  }
} catch (e) {}
</script>
