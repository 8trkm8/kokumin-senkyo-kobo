<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投票用紙の書き方 画像工場｜こくみん選挙ツール工房</title>
<meta name="description" content="候補者名と日程を入れるだけで、投票用紙の書き方を案内する画像が作れる無料ツールです。写真と文字はあなたの端末の中だけで処理され、送信されません。">
<style>
  body { font-family: "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; margin: 0; background: #f4f4f6; color: #222; }
  .wrap { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto; }
  .form { flex: 1 1 300px; background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .form h1 { font-size: 18px; margin: 0 0 4px; }
  .form p.note { font-size: 12px; color: #666; margin: 0 0 14px; line-height: 1.6; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 4px; }
  input[type=text], input[type=date] { width: 100%; box-sizing: border-box; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; }
  input[type=file] { font-size: 13px; }
  button { margin-top: 18px; width: 100%; font-size: 16px; font-weight: 700; padding: 12px; border: 0; border-radius: 10px; background: #0b3c8a; color: #fff; cursor: pointer; }
  .preview { flex: 0 1 430px; text-align: center; }
  canvas { width: 100%; max-width: 430px; height: auto; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.15); background: #fff; }
  .preview p { font-size: 12px; color: #666; }
</style>
</head>
<body>
<div class="wrap">
  <div class="form">
    <h1>投票用紙の書き方 画像工場</h1>
    <p class="note">入力すると右の画像がその場で作られます。写真はこの端末の中だけで処理され、どこにも送信されません。できあがったら「PNGをダウンロード」を押してください（1080×1350）。</p>
    <label>選挙エリア（例：群馬県はねうさ町）</label>
    <input type="text" id="area" value="群馬県はねうさ町">
    <label>選挙名（例：はねうさ町議会議員選挙）</label>
    <input type="text" id="election" value="はねうさ町議会議員選挙">
    <label>候補者名（投票用紙に書く表記のとおり）</label>
    <input type="text" id="name" value="月之崎はね太">
    <label>期日前投票 開始日</label>
    <input type="date" id="earlyStart" value="2026-02-21">
    <label>期日前投票 終了日</label>
    <input type="date" id="earlyEnd" value="2026-02-28">
    <label>投票日</label>
    <input type="date" id="voteDay" value="2026-03-01">
    <label>候補者写真（なくても作れます）</label>
    <input type="file" id="photo" accept="image/*">
    <div id="photoTools" style="display:none">
      <label>写真の大きさ</label>
      <input type="range" id="zoom" min="100" max="300" value="100" style="width:100%">
      <p class="note" style="margin:4px 0 0">写真はプレビューの上でドラッグして動かせます。スマホはピンチ、PCはマウスホイールでも拡大縮小できます。</p>
      <button type="button" id="resetPhoto" style="background:#666;margin-top:10px;padding:9px;font-size:14px">写真の位置をリセット</button>
    </div>
    <button id="download">PNGをダウンロード</button>
  </div>
  <div class="preview">
    <canvas id="cv" width="1080" height="1350"></canvas>
    <p>プレビュー（実物は1080×1350のPNGです）</p>
  </div>
</div>

const NAVY = "#0b3c8a", RED = "#e60012", INK = "#111111";
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",sans-serif';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const templateImg = new Image();
const PHOTO_R = { x: 0, y: 600, w: 505, h: 750 };
let photoImg = null;
let photoState = { zoom: 1, dx: 0, dy: 0 };
function photoGeom() {
  const cover = Math.max(PHOTO_R.w / photoImg.width, PHOTO_R.h / photoImg.height);
  const scale = cover * photoState.zoom;
  return { dw: photoImg.width * scale, dh: photoImg.height * scale };
}
function clampPhoto() {
  if (!photoImg) return;
  const { dw, dh } = photoGeom();
  photoState.dx = Math.min(0, Math.max(PHOTO_R.w - dw, photoState.dx));
  photoState.dy = Math.min(0, Math.max(PHOTO_R.h - dh, photoState.dy));
}
function resetPhoto() {
  if (!photoImg) return;
  photoState = { zoom: 1, dx: 0, dy: 0 };
  const { dw } = photoGeom();
  photoState.dx = (PHOTO_R.w - dw) / 2;
  photoState.dy = 0;
  clampPhoto();
  const z = document.getElementById('zoom'); if (z) z.value = 100;
}

function vText(text, cx, y0, fontSize, color, pitchRatio) {
  ctx.fillStyle = color;
  ctx.font = "800 " + fontSize + "px " + FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  const pitch = fontSize * (pitchRatio || 1.05);
  [...text].forEach((ch, i) => {
    ctx.fillText(ch, cx, y0 + i * pitch);
  });
}
function weekdayChar(d) { return "日月火水木金土"[d.getDay()]; }
function md(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }
function chip(cx, cy, d) {
  const w = d.getDay();
  ctx.beginPath();
  ctx.arc(cx, cy, 40, 0, Math.PI * 2);
  if (w === 6) { ctx.fillStyle = NAVY; ctx.fill(); }
  else if (w === 0) { ctx.fillStyle = RED; ctx.fill(); }
  else { ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#999999"; ctx.stroke(); }
  ctx.fillStyle = (w === 6 || w === 0) ? "#ffffff" : INK;
  ctx.font = "800 44px " + FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(weekdayChar(d), cx, cy + 2);
}
function dateWithChip(centerX, baselineY, d) {
  if (!d || isNaN(d)) return;
  ctx.font = "800 88px Arial, \"Helvetica Neue\", Helvetica, " + FONT;
  const s = md(d);
  const w = ctx.measureText(s).width;
  const x = centerX - (w + 14 + 80) / 2;
  ctx.fillStyle = INK;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(s, x, baselineY);
  chip(x + w + 14 + 40, baselineY - 32, d);
}
function draw() {
  ctx.clearRect(0, 0, 1080, 1350);
  ctx.drawImage(templateImg, 0, 0, 1080, 1350);
  const area = document.getElementById('area').value.trim();
  const election = document.getElementById('election').value.trim();
  const name = document.getElementById('name').value.trim();
  // 右端の白帯＋エリア文
  if (area) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(959, 0, 121, 1180);
    const full = area + "にお住まいの皆様";
    const fs = Math.min(66, Math.floor(1050 / full.length));
    vText(full, 1020, 48, fs, NAVY, 1.06);
  }
  // 紺帯に選挙名（白・縦）
  if (election) {
    const fs = Math.min(80, Math.floor(950 / election.length));
    vText(election, 906, 52, fs, "#ffffff", 1.05);
  }
  // 日付
  const es = document.getElementById('earlyStart').valueAsDate;
  const ee = document.getElementById('earlyEnd').valueAsDate;
  const vd = document.getElementById('voteDay').valueAsDate;
  dateWithChip(190, 205, es);
  if (es && ee) {
    ctx.save();
    ctx.translate(145, 268);
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = INK;
    ctx.font = "800 78px " + FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("〜", 0, 0);
    ctx.restore();
  }
  dateWithChip(190, 395, ee);
  dateWithChip(190, 580, vd);
  // 写真（左下・ドラッグ/ズームで調整可能）
  if (photoImg) {
    const { dw, dh } = photoGeom();
    ctx.save();
    ctx.beginPath();
    ctx.rect(PHOTO_R.x, PHOTO_R.y, PHOTO_R.w, PHOTO_R.h);
    ctx.clip();
    ctx.drawImage(photoImg, PHOTO_R.x + photoState.dx, PHOTO_R.y + photoState.dy, dw, dh);
    ctx.restore();
  }
  // 候補者名（中央パネル・縦・大・上下センター揃え）
  if (name) {
    const fs = name.length <= 6 ? 150 : Math.min(150, Math.floor(1010 / name.length));
    const pitch = fs * 1.03;
    const total = (name.length - 1) * pitch + fs;
    const areaTop = 190, areaH = 1300 - 190;
    const y0 = areaTop + Math.max(0, (areaH - total) / 2);
    vText(name, 566, y0, fs, INK, 1.03);
  }
}
templateImg.onload = draw;
templateImg.src = TEMPLATE_SRC;
document.querySelectorAll('input').forEach(el => el.addEventListener('input', draw));
document.getElementById('photo').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) { photoImg = null; document.getElementById('photoTools').style.display = 'none'; draw(); return; }
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => { photoImg = img; document.getElementById('photoTools').style.display = 'block'; resetPhoto(); draw(); };
    img.src = r.result;
  };
  r.readAsDataURL(f);
});
document.getElementById('download').addEventListener('click', () => {
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'ballot.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});
// 写真の移動・拡大縮小（SNSアイコン設定と同じ操作感）
const zoomEl = document.getElementById('zoom');
function setZoom(z) {
  if (!photoImg) return;
  const prev = photoGeom();
  photoState.zoom = Math.min(3, Math.max(1, z));
  const next = photoGeom();
  photoState.dx -= (next.dw - prev.dw) / 2;
  photoState.dy -= (next.dh - prev.dh) / 2;
  clampPhoto();
  zoomEl.value = Math.round(photoState.zoom * 100);
  draw();
}
zoomEl.addEventListener('input', () => { if (photoImg) setZoom(zoomEl.value / 100); });
document.getElementById('resetPhoto').addEventListener('click', () => { resetPhoto(); draw(); });
function toCanvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * 1080 / r.width, y: (e.clientY - r.top) * 1350 / r.height };
}
const pointers = new Map();
let pinchDist = null;
cv.style.touchAction = 'none';
cv.addEventListener('pointerdown', e => {
  if (!photoImg) return;
  const p = toCanvasPos(e);
  if (p.x < PHOTO_R.x || p.x > PHOTO_R.x + PHOTO_R.w || p.y < PHOTO_R.y || p.y > PHOTO_R.y + PHOTO_R.h) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cv.setPointerCapture(e.pointerId);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prevP = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = cv.getBoundingClientRect();
  if (pointers.size === 1) {
    photoState.dx += (e.clientX - prevP.x) * 1080 / r.width;
    photoState.dy += (e.clientY - prevP.y) * 1350 / r.height;
    clampPhoto(); draw();
  } else if (pointers.size === 2 && pinchDist) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const ratio = d / pinchDist;
    pinchDist = d;
    setZoom(photoState.zoom * ratio);
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => {
  if (!photoImg) return;
  const p = toCanvasPos(e);
  if (p.x > PHOTO_R.x + PHOTO_R.w || p.y < PHOTO_R.y) return;
  e.preventDefault();
  setZoom(photoState.zoom * (e.deltaY < 0 ? 1.06 : 0.94));
}, { passive: false });
</script>
</body>
